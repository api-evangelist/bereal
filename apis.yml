name: BeReal
description: BeReal is a French social media application that encourages authentic, unfiltered daily
  sharing through a two-minute random notification window in which users capture a moment using both
  the front and rear cameras simultaneously. Positioned as an alternative to curated, algorithmic social
  media, it emphasizes genuine connection over performance and explicitly excludes AI-generated content
  from the platform. Founded in France and acquired by mobile publisher Voodoo, BeReal operates a consumer
  mobile product with a help center and an advertising business, but publishes no public developer API,
  developer portal, or SDKs. This API Evangelist profile was surfaced via a16z and Accel portfolio data
  and enriched with the provider's real public web properties and domain-security posture.
